<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu cantinho 💕</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #f8b8d4,
                    #e8b7ff
                );

            color: #333;
        }


        .container {
            width: 90%;
            max-width: 420px;

            text-align: center;

            background: rgba(255, 255, 255, 0.92);

            padding: 40px 25px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);
        }


        .emoji {
            font-size: 55px;

            margin-bottom: 10px;
        }


        h1 {
            margin: 0 0 12px;

            font-size: 30px;

            color: #d63384;
        }


        p {
            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 28px;

            color: #555;
        }


        .botao {
            display: block;

            width: 100%;

            padding: 16px;

            border-radius: 15px;

            background: #0088cc;

            color: white;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            transition: 0.2s;
        }


        .botao:hover {
            transform: scale(1.03);

            background: #0077b5;
        }


        .rodape {
            margin-top: 22px;

            font-size: 13px;

            color: #888;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="emoji">
            💕
        </div>


        <h1>
            Oii, neném! 🥰
        </h1>


        <p>
            Quer continuar comigo?
            <br>
            É só clicar no botão abaixo. 👀💕
        </p>


        <a
            class="botao"
            href="https://t.me/PgmtsLtdaBot"
            target="_blank"
        >
            💬 Entrar no Telegram
        </a>


        <div class="rodape">
            ✨ Te espero por lá ✨
        </div>

    </div>

</body>

</html>
