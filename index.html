<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juliana ✨</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffc6dc, #e4b8ff);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 38px 28px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(100, 40, 90, 0.2);
        }

        h1 {
            color: #db3282;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .button {
            width: 100%;
            display: block;
            padding: 17px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .telegram {
            background: #229ED9;
        }

        .instagram {
            background: linear-gradient(
                90deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );
        }

        .tiktok {
            background: #111;
        }

        .footer {
            margin-top: 24px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div style="font-size: 34px; margin-bottom: 10px;">
            💕
        </div>

        <h1>Oii, neném! 🥰</h1>

        <p class="subtitle">
            Quer acompanhar mais de mim?<br>
            Escolhe uma opção abaixo 💗
        </p>

        <div class="buttons">

            <a
                class="button telegram"
                href="https://t.me/Julianaestuaivini"
                target="_blank"
            >
                💬 Entrar no Telegram
            </a>

            <a
                class="button instagram"
                href="https://www.instagram.com/estuaivini/"
                target="_blank"
            >
                📸 Instagram
            </a>

            <a
                class="button tiktok"
                href="https://www.tiktok.com/@julianaestuaivini"
                target="_blank"
            >
                🎵 TikTok
            </a>

        </div>

        <div class="footer">
            ✨ te espero por lá ✨
        </div>

    </div>

</body>

</html>
