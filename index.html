<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juliana ✨</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, #ffd4e4, transparent 40%),
                linear-gradient(135deg, #ffc6dc, #e4b8ff);
        }

        .card {
            width: 100%;
            max-width: 420px;

            padding: 40px 28px;

            background: rgba(255, 255, 255, 0.92);

            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(115, 57, 96, 0.20);

            backdrop-filter: blur(10px);
        }

        .hearts {
            font-size: 34px;
            margin-bottom: 12px;
        }

        h1 {
            color: #db3282;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 17px 20px;

            border-radius: 15px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .instagram {
            color: white;

            background:
                linear-gradient(
                    90deg,
                    #833ab4,
                    #fd1d1d,
                    #fcb045
                );

            box-shadow:
                0 8px 20px rgba(225, 48, 108, 0.25);
        }

        .tiktok {
            color: white;
            background: #111;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .footer {
            margin-top: 28px;

            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="hearts">
            💕
        </div>

        <h1>Oii, neném! 🥰</h1>

        <p class="subtitle">
            Quer acompanhar um pouco mais de mim?<br>
            Escolhe onde você quer me seguir 💗
        </p>

        <div class="buttons">

            <a
                class="button instagram"
                href="https://www.instagram.com/estuaivini/"
                target="_blank"
                rel="noopener noreferrer"
            >
                📸 Instagram
            </a>

            <a
                class="button tiktok"
                href="https://www.tiktok.com/@julianaestuaivini"
                target="_blank"
                rel="noopener noreferrer"
            >
                🎵 TikTok
            </a>

        </div>

        <div class="footer">
            ✨ te espero por lá ✨
        </div>

    </div>

</body>

</html>
